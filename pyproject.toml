[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineral-prediction-api"
version = "0.2.0"
description = "GINN and baseline workflows for spatially blocked mineral prospectivity mapping."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "geopandas>=0.14",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "pyogrio>=0.7",
  "shapely>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.2",
  "matplotlib>=3.8",
  "pillow>=10",
  "joblib>=1.3",
  "shap>=0.45",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "xgboost>=2.0",
  "optuna>=3.6",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
]

[project.scripts]
mineral-prediction-api = "mineral_prediction_api.main:main"

[project.urls]
Repository = "https://github.com/soeaxy/husab-ginn"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mineral_prediction_api = ["static/*.html"]
